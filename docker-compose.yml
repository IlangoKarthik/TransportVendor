version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: netkathir-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: netkathir
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - netkathir-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Netkathir AI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netkathir-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # MongoDB
      MONGODB_URI: mongodb://mongodb:27017/
      MONGO_DB_NAME: netkathir
      
      # Server
      NODE_ENV: production
      PORT: 80
      CLIENT_URL: http://localhost
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 7d
      
      # Email (configure with your SMTP)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@netkathir.com}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # OTP
      OTP_EXPIRY_MINUTES: 10
      
      # File Upload
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: .pdf,.docx,.doc,.txt,.md,.html
      
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - netkathir-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local

networks:
  netkathir-network:
    driver: bridge
